[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uau-extractor"
version = "0.1.0"
description = "Extração de dados da API UAU (Trinus/Globaltec) para o BI da TOP Construtora"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]
storage = [
    "supabase>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uau_extractor = ["sql/*.sql", "sql/migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"
